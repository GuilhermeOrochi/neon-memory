<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>NEON MEMORY | GuilhermeOrochi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b14;
      --panel: rgba(15, 22, 39, .88);
      --cyan: #00f5ff;
      --purple: #a855f7;
      --green: #00ff9c;
      --text: #e8f1ff;
      --muted: #8996ad;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text); font-family: Inter, sans-serif;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(0,245,255,.13), transparent 35%),
        radial-gradient(ellipse at 85% 85%, rgba(168,85,247,.16), transparent 35%),
        var(--bg);
    }
    .shell { width: min(100%, 620px); }
    .topline {
      display: flex; justify-content: space-between; gap: 12px;
      color: var(--green); font: 600 11px Orbitron, sans-serif;
      letter-spacing: 2px; margin-bottom: 12px;
    }
    .panel {
      padding: clamp(20px, 5vw, 34px);
      border: 1px solid rgba(0,245,255,.35); border-radius: 18px;
      background: var(--panel); box-shadow: 0 0 35px rgba(0,245,255,.08), inset 0 0 28px rgba(168,85,247,.04);
    }
    h1 {
      margin: 0; text-align: center; font: 800 clamp(28px, 7vw, 42px) Orbitron, sans-serif;
      letter-spacing: 3px; color: var(--cyan); text-shadow: 0 0 18px rgba(0,245,255,.55);
    }
    .subtitle { text-align: center; color: var(--muted); margin: 10px 0 26px; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat {
      text-align: center; padding: 12px 6px; border: 1px solid rgba(168,85,247,.35);
      border-radius: 10px; background: rgba(168,85,247,.07);
    }
    .stat strong { display: block; color: var(--green); font: 700 21px Orbitron, sans-serif; }
    .stat span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .card {
      aspect-ratio: 1; border: 1px solid rgba(0,245,255,.42); border-radius: 12px;
      background: linear-gradient(145deg, #111b30, #151027); color: transparent;
      cursor: pointer; font-size: clamp(25px, 7vw, 38px);
      box-shadow: inset 0 0 16px rgba(0,245,255,.05);
      transition: transform .18s, border-color .18s, box-shadow .18s, background .18s;
    }
    .card:not(:disabled):hover { transform: translateY(-3px); border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,245,255,.2); }
    .card::before { content: "?"; color: var(--purple); font: 700 25px Orbitron, sans-serif; }
    .card.revealed, .card.matched {
      color: white; background: rgba(0,245,255,.1); border-color: var(--green);
      box-shadow: 0 0 16px rgba(0,255,156,.16);
    }
    .card.revealed::before, .card.matched::before { content: ""; }
    .card.matched { opacity: .68; cursor: default; }
    .actions { display: flex; justify-content: center; margin-top: 22px; }
    .restart {
      border: 0; border-radius: 8px; padding: 13px 22px; cursor: pointer;
      color: #061018; background: var(--cyan); font: 700 12px Orbitron, sans-serif;
      letter-spacing: 1px; box-shadow: 0 0 18px rgba(0,245,255,.25);
    }
    .restart:hover { background: var(--green); }
    .message { min-height: 24px; text-align: center; color: var(--green); margin: 18px 0 0; font-weight: 600; font-size: 14px; }
    footer { text-align: center; color: #63718a; font-size: 11px; margin-top: 18px; letter-spacing: 1px; }
    @media (max-width: 380px) { .board { gap: 7px; } .panel { padding: 17px; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline"><span>GUILHERMEOROCHI</span><span>MINI GAME // 001</span></div>
    <section class="panel">
      <h1>NEON MEMORY</h1>
      <p class="subtitle">Encontre os 8 pares e complete o desafio.</p>

      <div class="stats">
        <div class="stat"><strong id="moves">0</strong><span>Movimentos</span></div>
        <div class="stat"><strong id="timer">00:00</strong><span>Tempo</span></div>
        <div class="stat"><strong id="best">--:--</strong><span>Recorde</span></div>
      </div>

      <div class="board" id="board" aria-label="Tabuleiro do jogo da memória"></div>
      <p class="message" id="message" aria-live="polite">Encontre os pares para vencer!</p>
      <div class="actions"><button class="restart" id="restart" type="button">↻ REINICIAR</button></div>
    </section>
    <footer>POWERED BY HTML • CSS • JAVASCRIPT</footer>
  </main>

  <script>
    const symbols = ["👾", "⚡", "💎", "🚀", "🧬", "🎮", "🌌", "🤖"];
    const board = document.getElementById("board");
    const movesDisplay = document.getElementById("moves");
    const timerDisplay = document.getElementById("timer");
    const bestDisplay = document.getElementById("best");
    const message = document.getElementById("message");
    const restartButton = document.getElementById("restart");

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let moves = 0;
    let matchedPairs = 0;
    let seconds = 0;
    let timerId = null;
    let started = false;

    function formatTime(value) {
      const minutes = Math.floor(value / 60).toString().padStart(2, "0");
      const secs = (value % 60).toString().padStart(2, "0");
      return `${minutes}:${secs}`;
    }

    function updateBest() {
      const best = Number(localStorage.getItem("neonMemoryBest"));
      bestDisplay.textContent = best > 0 ? formatTime(best) : "--:--";
    }

    function startTimer() {
      if (started) return;
      started = true;
      timerId = setInterval(() => {
        seconds++;
        timerDisplay.textContent = formatTime(seconds);
      }, 1000);
    }

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function createBoard() {
      board.innerHTML = "";
      const deck = shuffle([...symbols, ...symbols]);

      deck.forEach((symbol) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.dataset.symbol = symbol;
        card.setAttribute("aria-label", "Carta fechada");
        card.addEventListener("click", () => flipCard(card));
        board.appendChild(card);
      });
    }

    function flipCard(card) {
      if (lockBoard || card === firstCard || card.classList.contains("matched") || card.classList.contains("revealed")) return;

      startTimer();
      card.classList.add("revealed");
      card.textContent = card.dataset.symbol;
      card.setAttribute("aria-label", `Carta ${card.dataset.symbol}`);

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      moves++;
      movesDisplay.textContent = moves;
      checkMatch();
    }

    function checkMatch() {
      const isMatch = firstCard.dataset.symbol === secondCard.dataset.symbol;

      if (isMatch) {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        firstCard.disabled = true;
        secondCard.disabled = true;
        matchedPairs++;
        resetTurn();

        if (matchedPairs === symbols.length) finishGame();
      } else {
        lockBoard = true;
        setTimeout(() => {
          firstCard.classList.remove("revealed");
          secondCard.classList.remove("revealed");
          firstCard.textContent = "";
          secondCard.textContent = "";
          firstCard.setAttribute("aria-label", "Carta fechada");
          secondCard.setAttribute("aria-label", "Carta fechada");
          resetTurn();
        }, 750);
      }
    }

    function resetTurn() {
      [firstCard, secondCard] = [null, null];
      lockBoard = false;
    }

    function finishGame() {
      clearInterval(timerId);
      const previousBest = Number(localStorage.getItem("neonMemoryBest"));
      if (!previousBest || seconds < previousBest) {
        localStorage.setItem("neonMemoryBest", seconds);
        message.textContent = `✦ NOVO RECORDE! Você venceu em ${formatTime(seconds)}!`;
      } else {
        message.textContent = `✦ MISSÃO CONCLUÍDA! Tempo: ${formatTime(seconds)}.`;
      }
      updateBest();
    }

    function restartGame() {
      clearInterval(timerId);
      firstCard = null;
      secondCard = null;
      lockBoard = false;
      moves = 0;
      matchedPairs = 0;
      seconds = 0;
      started = false;
      timerId = null;
      movesDisplay.textContent = "0";
      timerDisplay.textContent = "00:00";
      message.textContent = "Encontre os pares para vencer!";
      createBoard();
      updateBest();
    }

    restartButton.addEventListener("click", restartGame);
    restartGame();
  </script>
</body>
</html>
